services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unimove
      POSTGRES_USER: unimove
      POSTGRES_PASSWORD: unimove_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimove -d unimove"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
